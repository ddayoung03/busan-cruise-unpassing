<meta charset="utf-8">
<title>Busan Bite Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 항구 신호기 — 짙은 바다색 바탕의 상단 띠, 승객 시간표는 부두 시각표처럼 시각을 왼쪽에 고정한 세로 타임라인 */
:root{
  --sea:#0B3C5D; --sea-2:#14557F; --tide:#328CC1; --coral:#E8573F; --foam:#EAF2F8;
  --bg:#F6F8FA; --card:#FFFFFF; --ink:#1D2B36; --mute:#5B6B78; --line:#D7E1E9; --ok:#2E8B57; --warn:#C47F12;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0E2A3F; --sea-2:#173F5E; --tide:#5BB0E6; --coral:#FF7A63; --foam:#16293A;
  --bg:#0C1620; --card:#132230; --ink:#E6EEF4; --mute:#93A6B6; --line:#24384A; --ok:#5CC48C; --warn:#E3A93C; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0E2A3F; --sea-2:#173F5E; --tide:#5BB0E6; --coral:#FF7A63; --foam:#16293A;
  --bg:#0C1620; --card:#132230; --ink:#E6EEF4; --mute:#93A6B6; --line:#24384A; --ok:#5CC48C; --warn:#E3A93C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--sea);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-weight:900;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand small{font-weight:500;font-size:12px;opacity:.75;letter-spacing:.02em}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font:600 12px var(--f-body);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--sea)}
nav{background:var(--sea-2)}
nav .wrap{display:flex;gap:4px;overflow-x:auto}
nav a{color:#D6E6F2;text-decoration:none;font-weight:600;font-size:14px;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:#fff;border-color:var(--coral)}
main{padding-block:20px 48px}
h1{font-size:clamp(22px,4vw,30px);line-height:1.25;margin:0 0 6px;text-wrap:balance;font-weight:900}
.lead{color:var(--mute);margin:0 0 18px;max-width:62ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
form.ask{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.02em}
select,button.go{font:600 15px var(--f-body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
button.go{background:var(--coral);color:#fff;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute);align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 13px var(--f-body);cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sum b{display:block;font:600 22px var(--f-num);color:var(--sea-2)}
:root[data-theme="dark"] .sum b{color:var(--tide)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sum b{color:var(--tide)}}
.sum span{font-size:12px;color:var(--mute)}
.result{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.result>*,.fc>*,.sum>*,form.ask>*{min-width:0}
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--foam)}
.mapbox canvas{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab}
.mapbox canvas.zoomed{touch-action:none}
.mapbox canvas:active{cursor:grabbing}
.zoomtools{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.zoomtools button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 18px var(--f-body);border-radius:8px;cursor:pointer}
.maptools{position:absolute;top:8px;left:8px;display:flex;gap:4px}
.maptools button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 12px var(--f-body);padding:4px 10px;border-radius:999px;cursor:pointer}
.maptools button[aria-pressed="true"]{background:var(--sea);color:#fff;border-color:var(--sea)}
.credit{position:absolute;right:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.85);color:#333;padding:1px 6px;border-radius:4px}
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:64px 28px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.tl time{font:600 16px var(--f-num);color:var(--sea-2);padding-top:2px}
:root[data-theme="dark"] .tl time{color:var(--tide)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tl time{color:var(--tide)}}
.pin{width:26px;height:26px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font:700 13px var(--f-body)}
.pin.end{background:var(--coral)}
.pin.see{background:#2E8B57}   /* 볼거리(먹지 않는 곳) */
.tl h3{margin:0;font-size:16px;line-height:1.35}
.tl .menu{color:var(--mute);font-size:13px;margin:2px 0 6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--foam);color:var(--ink)}
.tag.q{background:rgba(232,87,63,.12);color:var(--coral)}
.tag.est{border:1px dashed var(--mute);background:transparent;color:var(--mute)}
.alert{display:flex;gap:10px;align-items:flex-start;background:rgba(232,87,63,.1);border:1px solid rgba(232,87,63,.35);border-radius:var(--r);padding:12px;margin-top:12px;font-size:14px}
.alert b{color:var(--coral)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.fc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:20px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--tide);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:600 11px var(--f-num);color:var(--ink)}
.hours{display:flex;gap:6px;font:500 11px var(--f-num);color:var(--mute)}
.hours span{flex:1;text-align:center}
.heat{overflow-x:auto}
.heat table{border-collapse:collapse;font-size:12px;min-width:560px;width:100%}
.heat th,.heat td{padding:6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.heat th:first-child,.heat td:first-child{text-align:left;white-space:nowrap}
.heat tr{cursor:pointer}
.heat tr[aria-selected="true"] td:first-child{font-weight:700;color:var(--coral)}
.dm{position:relative;overflow-x:auto}
.dm-grid{position:relative;display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px 26px;min-width:860px;padding:8px 4px}
.dm-col h4{margin:0 0 8px;font-size:12px;letter-spacing:.05em;color:var(--coral)}
.dm-col{display:flex;flex-direction:column;gap:10px}
.dm-node{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;text-align:left;font:500 13px var(--f-body);color:var(--ink);cursor:pointer;position:relative;z-index:1}
.dm-node small{display:block;color:var(--mute);font-size:11px}
.dm-node.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.dm-node.rel{border-color:var(--tide)}
.dm-node.dim{opacity:.35}
.dm svg{position:absolute;inset:0;pointer-events:none;z-index:0}
.dm-detail{margin-top:14px}
.dm-detail h3{margin:0 0 6px}
.dm-detail dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
.dm-detail dt{color:var(--mute)}
.dm-detail code{font:500 12px var(--f-num);background:var(--foam);padding:1px 6px;border-radius:4px}
footer{color:var(--mute);font-size:12px;padding-block:24px;border-top:1px solid var(--line)}
@media (max-width:760px){
  form.ask{grid-template-columns:1fr 1fr}
  .sum{grid-template-columns:1fr 1fr}
  .result,.fc{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.tl li{animation:in .3s ease both}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<header><div class="wrap">
  <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#E8573F"/><path d="M7 17h14l-2 4H9z" fill="#fff"/><path d="M13 6v10M13 7l6 6h-6" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Busan Bite Pass<br><small data-t="tag"></small></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ko">KO</button><button data-lang="en">EN</button><button data-lang="zh">中</button><button data-lang="ja">日</button>
  </div>
</div></header>
<nav><div class="wrap">
  <a href="#route" data-tab="route" data-t="tab_route"></a>
  <a href="#merchant" data-tab="merchant" data-t="tab_merchant"></a>
  <a href="#data" data-tab="data" data-t="tab_data"></a>
</div></nav>

<main class="wrap">
<section id="v-route">
  <h1 data-t="h_route"></h1>
  <p class="lead" data-t="lead_route"></p>
  <div class="panel">
    <form class="ask" id="ask">
      <label for="term"><span data-t="f_term"></span><select id="term"><option value="D1"></option><option value="D2"></option></select></label>
      <label for="start"><span data-t="f_start"></span><select id="start"></select></label>
      <label for="board"><span data-t="f_board"></span><select id="board"></select></label>
      <button class="go" type="submit" data-t="go"></button>
    </form>
    <div class="examples"><span data-t="ex"></span>
      <button class="chip" data-ex="D1,510,1020" data-t="ex1"></button>
      <button class="chip" data-ex="D2,720,975" data-t="ex2"></button>
      <button class="chip" data-ex="D1,600,930" data-t="ex3"></button>
    </div>
  </div>
  <div class="sum" id="sum"></div>
  <div class="result">
    <div>
      <div class="mapbox"><canvas id="map" width="1040" height="860" role="img" aria-label="route map"></canvas>
        <div class="maptools"><button data-map="core" data-t="m_core"></button><button data-map="wide" data-t="m_wide"></button></div>
        <div class="zoomtools"><button data-zoom="1.5" aria-label="zoom in">+</button><button data-zoom="0.667" aria-label="zoom out">−</button><button data-zoom="0" aria-label="reset map">⟲</button></div>
        <span class="credit" id="credit"></span></div>
      <div class="alert" id="alert"></div>
    </div>
    <div class="panel"><ol class="tl" id="tl"></ol><p class="note" data-t="note_route"></p></div>
  </div>
</section>

<section id="v-merchant" hidden>
  <h1 data-t="h_merchant"></h1>
  <p class="lead" data-t="lead_merchant"></p>
  <div class="fc">
    <div class="panel"><label for="store"><span data-t="f_store"></span><select id="store"></select></label>
      <div class="bars" id="bars" aria-label="expected visitors by hour"></div><div class="hours" id="hrs"></div>
      <p class="note" id="fcnote"></p></div>
    <div class="panel heat"><table id="heat"></table></div>
  </div>
  <p class="note" data-t="note_merchant"></p>
</section>

<section id="v-data" hidden>
  <h1 data-t="h_data"></h1>
  <p class="lead" data-t="lead_data"></p>
  <div class="panel dm" id="dm"><svg id="dmsvg"></svg><div class="dm-grid" id="dmgrid"></div></div>
  <div class="panel dm-detail" id="dmd"></div>
</section>
</main>
<footer><div class="wrap" data-t="foot"></div></footer>

function clampV(cv){V.z=Math.min(4,Math.max(1,V.z));V.x=Math.min(cv.width*(1-1/V.z),Math.max(0,V.x));V.y=Math.min(cv.height*(1-1/V.z),Math.max(0,V.y))}

  cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,loc(e));cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const[a,b]=pts.get(e.pointerId),[c,d]=loc(e);pts.set(e.pointerId,[c,d]);

let DMSEL='a3';
function renderDM(){
  const grid=document.getElementById('dmgrid');
  grid.innerHTML=DM.cols[L].map((h,i)=>`<div class="dm-col"><h4>${h}</h4>${DM.nodes.filter(n=>n[1]===i).map(n=>`<button class="dm-node" data-id="${n[0]}">${L==='ko'?n[2]:(n[3]||n[2])}<small>${(L==='ko'?n[4]:n[4]).split(' · ')[0]}</small></button>`).join('')}</div>`).join('');
  grid.querySelectorAll('.dm-node').forEach(b=>b.onclick=()=>{DMSEL=b.dataset.id;renderDM()});
  requestAnimationFrame(drawDM);
}
function drawDM(){
  const box=document.getElementById('dm'),svg=document.getElementById('dmsvg'),grid=document.getElementById('dmgrid');
  const R=grid.getBoundingClientRect(),W=grid.scrollWidth,H=grid.scrollHeight;
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.style.width=W+'px';svg.style.height=H+'px';
  const pos=id=>{const e=grid.querySelector(`[data-id="${id}"]`).getBoundingClientRect();return{l:e.left-R.left,r:e.right-R.left,y:e.top-R.top+e.height/2}};
  const by=Object.fromEntries(DM.nodes.map(n=>[n[0],n]));
  const up=new Set,down=new Set;
  (function d(id){by[id][6].forEach(x=>{if(!down.has(x)){down.add(x);d(x)}})})(DMSEL);
  (function u(id){DM.nodes.forEach(n=>{if(n[6].includes(id)&&!up.has(n[0])){up.add(n[0]);u(n[0])}})})(DMSEL);
  const css=getComputedStyle(document.documentElement);
  let s='';
  DM.nodes.forEach(n=>n[6].forEach(to=>{const a=pos(n[0]),b=pos(to);const hot=(up.has(n[0])||n[0]===DMSEL)&&(down.has(to)||to===DMSEL||up.has(to));
    const x1=a.r,x2=b.l,mx=(x1+x2)/2;s+=`<path d="M${x1},${a.y} C${mx},${a.y} ${mx},${b.y} ${x2},${b.y}" fill="none" stroke="${hot?css.getPropertyValue('--coral'):css.getPropertyValue('--line')}" stroke-width="${hot?2.5:1.2}"/>`}));
  svg.innerHTML=s;
  grid.querySelectorAll('.dm-node').forEach(b=>{const id=b.dataset.id;b.classList.toggle('on',id===DMSEL);b.classList.toggle('rel',up.has(id)||down.has(id));b.classList.toggle('dim',!(id===DMSEL||up.has(id)||down.has(id)))});
  const n=by[DMSEL];
  document.getElementById('dmd').innerHTML=`<h3>${n[2]}${n[3]&&n[3]!==n[2]?` <small style="color:var(--mute);font-weight:500">${n[3]}</small>`:''}</h3><dl><dt>${L==='ko'?'한 일':'What'}</dt><dd>${n[4]}</dd><dt>${L==='ko'?'파일':'File'}</dt><dd><code>${n[5]}</code></dd><dt>${L==='ko'?'다음 단계':'Feeds into'}</dt><dd>${n[6].map(x=>by[x][2]).join(', ')||'—'}</dd></dl>`;
}
window.addEventListener('resize',()=>{if(!document.getElementById('v-data').hidden)drawDM()});
