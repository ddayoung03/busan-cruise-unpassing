<!doctype html>
<!--
  북항에 직항 티켓형 팜플렛 (A4 가로, 앞·뒤 티켓 2장). 언어: ?lang=ko|en|ja|zhs|zht
  PDF 출력:
    for l in ko en ja zhs zht; do chrome --headless=new --no-pdf-header-footer \
      --print-to-pdf=out_$l.pdf "file:///.../pamphlet.html?lang=$l"; done
-->
<html>
<head>
<meta charset="utf-8">
<title>북항에 직항 팜플렛</title>
<style>
  @page { size: 297mm 210mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0f1f33; --ink: #1d2a3a; --muted: #6b7380;
    --paper: #f6f1e6; --gold: #b8873a; --line: #d9cfbd;
    --title: 27mm;
  }
  html, body { width: 297mm; height: 210mm; }
  body {
    font-family: Pretendard, "Malgun Gothic", sans-serif;
    color: var(--ink); background: #fff;
    display: grid; grid-template-columns: 1fr 1fr; position: relative;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    line-height: 1.4;
  }
  body.ko  { word-break: keep-all; }
  body.ja  { font-family: "Yu Gothic", "YuGothic", sans-serif; }
  body.zhs { font-family: "Microsoft YaHei", sans-serif; }
  body.zht { font-family: "Microsoft JhengHei", sans-serif; }
  body.en  { --title: 17mm; }
  body.ja { --title: 21mm; }
  body.ja .head h1 { font-size: 4.5mm; }
  body.zhs, body.zht { --title: 19mm; }
  body.en .sub { display: none; }
  body.en .compare div { grid-template-columns: 27mm 1fr; padding: 1.8mm 0; }
  body.en .compare, body.en .features { margin-top: 4mm; }
  body.en .features li { padding: 2mm 0; }

  /* 가운데 재단선 */
  body::after {
    content: ""; position: absolute; left: 50%; top: 6mm; bottom: 6mm;
    border-left: 0.25mm dashed #b9c2cc;
  }
  .half { display: grid; place-items: center; }

  .ticket {
    width: 92mm; height: 196mm; border-radius: 4mm; overflow: hidden;
    display: flex; flex-direction: column; background: var(--paper);
  }
  .main { flex: 1; padding: 9mm 8mm 7mm; display: flex; flex-direction: column; }
  /* 절취선 + 양옆 반원 홈 */
  .stub {
    height: 50mm; flex: none; background: var(--navy); color: #fff; position: relative;
    padding: 8mm 8mm 7mm; display: flex; gap: 5mm; align-items: center;
    border-top: 0.4mm dashed rgba(255,255,255,.35);
  }
  .stub::before, .stub::after {
    content: ""; position: absolute; top: -3mm; width: 6mm; height: 6mm;
    border-radius: 50%; background: #fff;
  }
  .stub::before { left: -3mm; } .stub::after { right: -3mm; }
  .qr { width: 27mm; height: 27mm; background: #fff; padding: 1.5mm; border-radius: 1.5mm; flex: none; }
  .qr img { width: 100%; height: 100%; display: block; }
  .stub-text { flex: 1; min-width: 0; }

  .label {
    font-family: Pretendard, sans-serif; font-size: 2.3mm; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; color: var(--gold);
  }
  .stub .label { margin-bottom: 2mm; }

  /* 앞면 */
  .top { display: flex; justify-content: space-between; }
  .top .label:first-child { color: var(--navy); }
  .title {
    margin-top: auto; font-weight: 900; color: var(--navy);
    font-size: var(--title); line-height: 1.02; letter-spacing: -.02em;
  }
  body.ja .title, body.zhs .title, body.zht .title { font-weight: 700; }
  .title span { display: block; }
  .title span + span { color: var(--gold); }
  .sub { margin-top: 4mm; font-family: Pretendard, sans-serif; font-size: 3mm; font-weight: 600; letter-spacing: .18em; color: var(--navy); }
  .fields {
    margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 0.3mm solid var(--navy); padding-top: 3mm; gap: 2mm;
  }
  .fields b { display: block; font-size: 3.1mm; margin-top: 1mm; line-height: 1.25; }
  .stub h2 { font-size: 4.3mm; line-height: 1.35; font-weight: 700; }
  .stub p { margin-top: 2.5mm; font-size: 2.9mm; color: #d9c49c; }

  /* 뒷면 */
  .head h1 { font-size: 5.4mm; line-height: 1.32; margin-top: 2mm; color: var(--navy); }
  .compare { margin-top: 6mm; border-top: 0.25mm solid var(--line); }
  .compare div { display: grid; grid-template-columns: 22mm 1fr; gap: 3mm; padding: 2.4mm 0; border-bottom: 0.25mm solid var(--line); font-size: 3mm; }
  .compare .before { color: var(--muted); }
  .compare .after { font-weight: 700; color: var(--navy); }
  .compare .after span:first-child { color: var(--gold); }
  .features { list-style: none; margin-top: 6mm; counter-reset: f; }
  .features li { counter-increment: f; display: grid; grid-template-columns: 7mm 1fr; padding: 2.6mm 0; }
  .features li::before { content: "0" counter(f); font-family: Pretendard, sans-serif; font-weight: 700; font-size: 3.2mm; color: var(--gold); }
  .features b { display: block; font-size: 3.5mm; color: var(--navy); }
  .features p { font-size: 2.8mm; color: #4a5361; margin-top: .8mm; }
  .steps { margin-top: auto; }
  .steps ol { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-top: 2.5mm; border-top: 0.3mm solid var(--navy); padding-top: 3mm; counter-reset: s; }
  .steps li { counter-increment: s; font-size: 2.9mm; font-weight: 600; line-height: 1.35; color: var(--navy); }
  .steps li::before { content: counter(s); display: block; font-family: Pretendard, sans-serif; font-size: 6mm; font-weight: 800; color: var(--gold); line-height: 1; margin-bottom: 1.5mm; }
  .back .stub { height: 56mm; flex-wrap: wrap; align-content: center; row-gap: 3mm; padding-top: 6mm; padding-bottom: 5mm; }
  .back .stub h2 { font-size: 3.6mm; }
  .langs { margin-top: 2.5mm; font-size: 2.6mm; color: #c9d0d9; }
  .foot { flex-basis: 100%; padding-top: 2mm; border-top: 0.25mm solid rgba(255,255,255,.2); font-size: 2.5mm; color: #c9d0d9; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5mm 2mm; }
  .foot > * { white-space: nowrap; }
  .foot b { color: #fff; }
</style>
</head>
<body>
<section class="half">
  <article class="ticket">
    <div class="main">
      <div class="top"><span class="label">Busan Bite Pass</span><span class="label">Boarding Pass</span></div>
      <h1 class="title" data-t="title"></h1>
      <div class="sub">DIRECT TO NORTH PORT</div>
      <div class="fields">
        <div><span class="label">Waiting</span><b data-t="f1"></b></div>
        <div><span class="label">Return</span><b data-t="f2"></b></div>
        <div><span class="label">Heritage</span><b data-t="f3"></b></div>
      </div>
    </div>
    <div class="stub">
      <div class="stub-text">
        <h2 data-t="frontCta"></h2>
        <p data-t="frontSub"></p>
      </div>
      <div class="qr"><img src="../../05_문서/QR/QR_BusanBitePass.svg" alt="QR"></div>
    </div>
  </article>
</section>

<section class="half">
  <article class="ticket back">
    <div class="main">
      <div class="head">
        <div class="label">Welcome to Busan North Port</div>
        <h1 data-t="headline"></h1>
      </div>
      <div class="compare">
        <div class="before"><span data-t="beforeK"></span><span data-t="before"></span></div>
        <div class="after"><span data-t="afterK"></span><span data-t="after"></span></div>
      </div>
      <ol class="features">
        <li><div><b data-t="ft1"></b><p data-t="fd1"></p></div></li>
        <li><div><b data-t="ft2"></b><p data-t="fd2"></p></div></li>
        <li><div><b data-t="ft3"></b><p data-t="fd3"></p></div></li>
      </ol>
      <div class="steps">
        <div class="label" data-t="howto"></div>
        <ol><li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li></ol>
      </div>
    </div>
    <div class="stub">
      <div class="stub-text">
        <h2 data-t="backCta"></h2>
        <div class="langs">한국어 · EN · 日本語 · 简体 · 繁體</div>
      </div>
      <div class="qr"><img src="../../05_문서/QR/QR_BusanBitePass.svg" alt="QR"></div>
      <div class="foot"><span data-t="help"></span><b data-t="org"></b></div>
    </div>
  </article>
</section>
